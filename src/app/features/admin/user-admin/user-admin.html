<h2 class="mb-4">Usuarios</h2>

<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th style="width: 180px">Rol</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (u of auth.users(); track u.id) {
        <tr>
          <td>{{ u.id }}</td>
          <td class="fw-semibold">
            {{ u.name }}
            @if (isMe(u.id)) {
              <span class="badge bg-secondary ms-1">Tú</span>
            }
          </td>
          <td>{{ u.email }}</td>
          <td>
            <select
              class="form-select form-select-sm"
              [value]="u.role"
              [disabled]="isMe(u.id)"
              (change)="changeRole(u.id, $event)"
            >
              <option value="cliente">Cliente</option>
              <option value="administrador">Administrador</option>
            </select>
          </td>
          <td class="text-end">
            <button class="btn btn-outline-danger btn-sm" [disabled]="isMe(u.id)" (click)="remove(u.id, u.name)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
<p class="small text-muted">No puedes cambiar tu propio rol ni eliminar tu propia cuenta.</p>
