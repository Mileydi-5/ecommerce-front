<h2 class="mb-4">Categorías</h2>

<div class="row g-4">
  <div class="col-md-7">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>Nombre</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (c of categoryService.categories(); track c.id) {
          <tr>
            <td class="fw-semibold">{{ c.name }}</td>
            <td class="text-end">
              <button class="btn btn-outline-primary btn-sm me-1" (click)="edit(c.id, c.name)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-outline-danger btn-sm" (click)="remove(c.id, c.name)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="mb-3">{{ editingId() !== null ? 'Editar categoría' : 'Nueva categoría' }}</h5>
        <form [formGroup]="form" (ngSubmit)="save()">
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Nombre" formControlName="name" />
            @if (form.controls.name.touched && form.controls.name.invalid) {
              <div class="text-danger small">Mínimo 3 caracteres.</div>
            }
          </div>
          <button type="submit" class="btn btn-success">Guardar</button>
          @if (editingId() !== null) {
            <button type="button" class="btn btn-outline-secondary ms-2" (click)="cancel()">Cancelar</button>
          }
        </form>
      </div>
    </div>
  </div>
</div>
